server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Hashed build output — safe to cache forever, the filename changes on every build.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html is the entry point that names the hashed chunks. If a browser
        # caches it, a rebuilt app keeps loading the previous chunks — so never cache it.
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|hubs|files|register|login|refresh|forgotPassword|resetPassword) {
        proxy_pass http://be:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
