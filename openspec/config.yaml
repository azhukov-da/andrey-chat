schema: spec-driven

context: |
  Real-time web chat: rooms, direct messages, contacts, presence, attachments.
  Backend: .NET 10 Clean Architecture (Domain/Application/Infrastructure/Web),
  EF Core + PostgreSQL, ASP.NET Core Identity (bearer + refresh tokens), SignalR hub at /hubs/chat.
  Frontend: React 19 + Vite + TypeScript, TanStack Query + Zustand, Tailwind/DaisyUI.
  Orchestrated with Docker Compose (db, be, fe); the frontend nginx proxies all backend traffic.
  Source requirements: chat_requirements.md, wireframes.txt, TheStory.md.

